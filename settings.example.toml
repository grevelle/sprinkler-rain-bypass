[location]
# Hartland, WI 53029 (Waukesha County)
latitude = 43.106
longitude = -88.351
timezone = "America/Chicago"

[watering]
# Block watering when cumulative rain over past_days exceeds this (inches).
# Defaults match Hunter Hydrawise (1.5 in / 3 days); UF/IFAS sensors often use ~1/4 in per event.
inches_required = 1.5
past_days = 3
updates_per_day = 1

[season]
# Hartland 53029 — Almanac avg. last spring frost May 7, first fall frost Oct 7.
start_month = 5
start_day = 7
end_month = 10
end_day = 7

[weather]
api_key = "YOUR_VISUAL_CROSSING_API_KEY"

[gpio]
relay = 25
watering_enabled_led = 4
watering_disabled_led = 27
mock = false

[runtime]
state_path = "state.json"
fail_mode = "disable_watering"
log_level = "INFO"
weather_timeout_seconds = 30
