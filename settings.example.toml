[location]
# Hartland, WI 53029 (Waukesha County) — installer resolves lat/long/timezone from zip_code.
zip_code = "53029"
latitude = 43.106
longitude = -88.351
timezone = "America/Chicago"

[balance]
# One daily program run (30 min/zone ≈ 0.3 in); adjust if your catch-cup test differs.
inches_per_cycle = 0.3

[watering]
# Daily check before typical morning irrigation (Rain Bird daily program).
check_hour = 4
check_minute = 30

[sewer]
# Hartland/Waukesha: annual sewer usage is set from Jan 16–Mar 15 water use (April bill).
start_month = 1
start_day = 16
end_month = 3
end_day = 15

[weather]
api_key = "YOUR_VISUAL_CROSSING_API_KEY"

[gpio]
relay = 25
watering_enabled_led = 4
watering_disabled_led = 27
mock = false

[runtime]
state_path = "state.json"
fail_mode = "disable_watering"
log_level = "INFO"
weather_timeout_seconds = 45
