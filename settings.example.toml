[location]
# Hartland, WI 53029 (Waukesha County)
latitude = 43.106
longitude = -88.351
timezone = "America/Chicago"

[watering]
# Block when recent cumulative rain (through today) exceeds this (inches).
# Defaults match Hunter Hydrawise (1.5 in / 3 days); UF/IFAS sensors often use ~1/4 in per event.
inches_required = 1.5
past_days = 3
# Block when forecast rain over the next forecast_days exceeds this total.
forecast_days = 2
forecast_inches_max = 0.5
# Block if any single day in the past window reaches this (0 = cumulative only).
event_inches = 0.25
# After a past-window block, stay off for this many days (Rain Bird default is 2; 0 = off).
rain_delay_days = 2
# Block when hourly precip over the next near_term_hours exceeds this (Rachio-style; 0 = off).
near_term_hours = 24
near_term_inches_max = 0.25
# Block when forecast low is below this on today or tomorrow (protect heads/pipes).
freeze_skip = true
freeze_temp_f = 32
# Daily check time when updates_per_day = 1 (before typical morning irrigation).
check_hour = 4
check_minute = 30
updates_per_day = 1

[sewer]
# Hartland/Waukesha: annual sewer usage is set from Jan 16–Mar 15 water use (April bill).
# Hard block — watering never allowed in this window (skips weather API and fail-mode override).
start_month = 1
start_day = 16
end_month = 3
end_day = 15

[weather]
api_key = "YOUR_VISUAL_CROSSING_API_KEY"

[gpio]
relay = 25
watering_enabled_led = 4
watering_disabled_led = 27
mock = false

[runtime]
state_path = "state.json"
fail_mode = "disable_watering"
log_level = "INFO"
weather_timeout_seconds = 45
