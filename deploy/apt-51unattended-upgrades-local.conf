// Drop-in for /etc/apt/apt.conf.d/51unattended-upgrades-rain-bypass
// Installed by rain-bypass-install setup-autoupdate / install.sh on Raspberry Pi.

// Dedicated appliance — apply all available package updates.
Unattended-Upgrade::Origins-Pattern {
    "origin=.*";
};

Unattended-Upgrade::AutoFixInterruptedDpkg "true";
Unattended-Upgrade::Remove-Unused-Dependencies "true";
Unattended-Upgrade::Remove-New-Unused-Dependencies "true";

// Reboot is handled by scripts/auto-update.sh after the midday app update (not at 04:15).
Unattended-Upgrade::Automatic-Reboot "false";
