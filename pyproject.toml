[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprinkler-rain-bypass"
version = "3.2.0"
description = "Raspberry Pi rain bypass controller for irrigation systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Greg Revelle" }]
dependencies = [
    "pydantic>=2.7,<3",
    "requests>=2.28,<3",
    "tomli-w>=1.0,<2",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "responses>=0.25", "ruff>=0.4", "pyright>=1.1"]
gpio = ["RPi.GPIO>=0.7; platform_system == 'Linux'"]
install = ["typer>=0.12,<1"]

[project.scripts]
rain-bypass = "rain_bypass.app:main"
rain-bypass-install = "rain_bypass.install_cli:app"

[project.urls]
Repository = "https://github.com/grevelle/sprinkler-rain-bypass"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rain_bypass = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live' --cov=rain_bypass --cov-report=term-missing --cov-fail-under=100"
markers = [
    "live: integration tests against the live Visual Crossing API (requires VISUAL_CROSSING_API_KEY)",
]

[tool.coverage.run]
branch = true
source = ["rain_bypass"]
omit = ["*/rain_bypass/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/rain_bypass/install_cli.py" = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingModuleSource = false
