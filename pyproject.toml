[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprinkler-rain-bypass"
version = "5.2.4"
description = "Raspberry Pi rain bypass controller for irrigation systems"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Greg Revelle" }]
dependencies = [
    "httpx",
    "pydantic",
    "tomli-w",
    "typer",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "respx", "ruff", "pyright", "pre-commit", "shellcheck-py", "gpiozero", "vulture"]
gpio = [
    "gpiozero; platform_system == 'Linux'",
    "lgpio; platform_system == 'Linux'",
]

[project.scripts]
rain-bypass = "rain_bypass.cli:app"
rain-bypass-install = "rain_bypass.install_cli:app"

[project.urls]
Repository = "https://github.com/grevelle/sprinkler-rain-bypass"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rain_bypass = ["py.typed", "static/dashboard.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-m", "not live",
    "--cov=rain_bypass",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
markers = [
    "live: integration tests against the live Visual Crossing API (requires VISUAL_CROSSING_API_KEY)",
]

[tool.coverage.run]
branch = true
source = ["rain_bypass"]
omit = ["*/rain_bypass/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"vulture_whitelist.py" = ["B018"]
"src/rain_bypass/install_cli.py" = ["E501"]
"src/rain_bypass/install_prompts.py" = ["E501"]
"src/rain_bypass/install_flow.py" = ["RUF001"]
"src/rain_bypass/status.py" = ["RUF001"]
"tests/test_status.py" = ["RUF001"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportMissingModuleSource = false
reportDeprecated = false
