[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprinkler-rain-bypass"
version = "2.0.0"
description = "Raspberry Pi rain bypass controller for irrigation systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Greg Revelle" }]
keywords = ["raspberry-pi", "sprinkler", "irrigation", "gpio", "weather"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "requests>=2.28,<3",
    "tomli>=2.0; python_version < '3.11'",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.25",
    "ruff>=0.4",
]
gpio = [
    "RPi.GPIO>=0.7; platform_system == 'Linux'",
]

[project.scripts]
rain-bypass = "rain_bypass.__main__:main"

[project.urls]
Homepage = "https://github.com/grevelle/sprinkler-rain-bypass"
Repository = "https://github.com/grevelle/sprinkler-rain-bypass"
Issues = "https://github.com/grevelle/sprinkler-rain-bypass/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
