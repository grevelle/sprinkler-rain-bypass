[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprinkler-rain-bypass"
version = "2.1.0"
description = "Raspberry Pi rain bypass controller for irrigation systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Greg Revelle" }]
dependencies = [
    "pydantic>=2.7,<3",
    "requests>=2.28,<3",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.4"]
gpio = ["RPi.GPIO>=0.7; platform_system == 'Linux'"]

[project.scripts]
rain-bypass = "rain_bypass.__main__:main"

[project.urls]
Repository = "https://github.com/grevelle/sprinkler-rain-bypass"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
