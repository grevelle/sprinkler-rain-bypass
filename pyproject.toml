[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprinkler-rain-bypass"
version = "3.1.0"
description = "Raspberry Pi rain bypass controller for irrigation systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Greg Revelle" }]
dependencies = [
    "pydantic>=2.7,<3",
    "requests>=2.28,<3",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "responses>=0.25", "ruff>=0.4"]
gpio = ["RPi.GPIO>=0.7; platform_system == 'Linux'"]

[project.scripts]
rain-bypass = "rain_bypass.app:main"

[project.urls]
Repository = "https://github.com/grevelle/sprinkler-rain-bypass"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rain_bypass = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=rain_bypass --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["rain_bypass"]
omit = ["*/rain_bypass/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
