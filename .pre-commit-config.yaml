default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
      - id: check-lf
        name: check LF line endings
        entry: python scripts/check_lf.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ci
        name: full CI (scripts/ci.py)
        entry: python scripts/ci.py --skip-install
        language: system
        pass_filenames: false
        stages: [pre-push]
