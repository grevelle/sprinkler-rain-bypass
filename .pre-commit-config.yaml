default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: ^install\.sh$
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: pytest
        name: pytest
        entry: pytest -q -m "not live" --cov=rain_bypass --cov-fail-under=100
        language: system
        pass_filenames: false
        stages: [pre-push]
