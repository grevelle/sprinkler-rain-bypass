name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,install]"
      - run: ruff check .
      - run: pyright
      - run: shellcheck install.sh
      - run: pytest -q --cov-fail-under=100
