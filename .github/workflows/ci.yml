name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: "3.x"
          check-latest: true
      - run: pip install --upgrade pip
      - run: pip install --upgrade -e ".[dev]"
      # Non-mutating lint (pre-commit --fix modifies files and fails CI if anything was dirty).
      - run: ruff check .
      - run: ruff format --check .
      - run: shellcheck install.sh configure.sh
      - run: python scripts/check_lf.py
      - run: pyright
      - run: pytest -q -m "not live" --cov=rain_bypass --cov-fail-under=100 --tb=short
