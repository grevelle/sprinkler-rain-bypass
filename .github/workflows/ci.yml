name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: "3.x"
          check-latest: true
      - name: Install package (latest deps)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --upgrade -e ".[dev]"
      # Single task list — scripts/ci.py (check-only ruff; no version pins).
      # .venv required so pyright resolves site-packages (dot-dirs are auto-excluded).
      - name: CI checks
        run: .venv/bin/python scripts/ci.py --skip-install
